[project]
name = "manji-downloader"
version = "0.1.0"
description = "Compliance-first CLI for retrieving anime series and episodic media from authorized sources."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manji Downloader contributors" }]
requires-python = ">=3.12"
keywords = ["anime", "cli", "downloader", "compliance", "robots-txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "protego>=0.3",
  "typer>=0.12",
  "rich>=13.7",
  "questionary>=2.0",
]

[project.scripts]
manji = "manji.cli.app:main"

[project.urls]
Homepage = "https://github.com/JustinReyes28/manji-downloader"
Repository = "https://github.com/JustinReyes28/manji-downloader"
Issues = "https://github.com/JustinReyes28/manji-downloader/issues"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-httpserver>=1.1",
  "respx>=0.21",
  "ruff>=0.6",
  "types-PyYAML>=6.0.12",
]
build = [
  "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manji"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/manji",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["manji", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["protego", "protego.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["questionary", "questionary.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp --cov=manji --cov-report=term-missing"
markers = [
  "unit: fast isolated tests",
  "integration: tests against local mock servers",
  "compliance: robots.txt, rate-limit, and redaction behavior",
]

[tool.coverage.run]
branch = true
source = ["manji"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
