name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_versions.py

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          # macos-13 was retired by GitHub; macos-14 retired on 2026-11-02.
          # macos-15-intel is the standard x64 runner, macos-15 the arm64 one.
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group build
      - name: Build binary
        run: uv run pyinstaller manji.spec --distpath dist --workpath build/pyinstaller
      - name: Generate platform package
        shell: bash
        run: |
          BINARY=dist/manji
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then BINARY=dist/manji.exe; fi
          uv run python scripts/build_platform_package.py \
            --platform "${{ matrix.platform }}" \
            --binary "$BINARY" \
            --output npm/platforms
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: npm/platforms/${{ matrix.platform }}

  publish-python:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    env:
      # Must be job-level: every publish step needs it, not just the last one.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: npm/platforms
      - name: Flatten artifact directories
        shell: bash
        run: |
          for platform in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if [ -d "npm/platforms/platform-$platform" ]; then
              mv "npm/platforms/platform-$platform" "npm/platforms/$platform"
            fi
            if [ ! -f "npm/platforms/$platform/package.json" ]; then
              echo "::error::missing platform package for $platform"
              exit 1
            fi
            npm publish "npm/platforms/$platform" --access public --provenance
          done
      - name: Publish root launcher last
        run: npm publish --access public --provenance
